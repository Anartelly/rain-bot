name: Rain Monitor 24/7

on:
  schedule:
    - cron: '0 * * * *' # Страховка каждый час
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Monitor
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" python monitor.py

      - name: Auto-Restart Next Cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run rain.yml
